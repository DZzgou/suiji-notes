<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1e4f8a"><meta name="description" content="简单、清晰、可靠的手机备忘录。"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="随记"><title>随记 · 极简备忘录</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="apple-touch-icon" href="./icon.svg"><style>
:root{--bg:#f6f8fb;--paper:#fff;--ink:#1d2b3a;--muted:#64758a;--line:#dce4ed;--blue:#1e4f8a;--soft:#eaf1f9;--size:20px;--safe:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:var(--size);line-height:1.55}.app{max-width:720px;min-height:100vh;margin:auto;padding-bottom:150px}.top{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:#f6f8fbf2;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.brand{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800}.mark{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--blue);color:white}.btn,.icon{min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:13px;background:white;color:var(--blue);font-size:16px;font-weight:700}.icon{width:48px;padding:0;font-size:22px}main{padding:20px 18px}.heading{margin:0 0 18px}.heading h1{margin:0;font-size:28px;line-height:1.3}.heading p{margin:5px 0 0;color:var(--muted);font-size:16px}.search{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 14px;margin-bottom:20px;border:1px solid var(--line);border-radius:14px;background:white}.search input{width:100%;border:0;outline:0;background:none;font:inherit;font-size:18px}.section{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px;font-size:18px;font-weight:800}.muted{color:var(--muted);font-size:14px}.list{display:grid;gap:10px}.card,.task,.empty{padding:15px;border:1px solid var(--line);border-radius:15px;background:white}.card h3{margin:5px 0 7px;font-size:21px;line-height:1.4;overflow-wrap:anywhere}.preview{color:var(--muted);font-size:var(--size);line-height:1.5;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.small{min-height:40px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--blue);font-size:14px;font-weight:700}.danger{color:#a33434}.empty{text-align:center;padding:28px 16px;border-style:dashed}.empty b{font-size:20px}.empty p{margin:5px 0 0;color:var(--muted);font-size:16px}.bottom{position:fixed;z-index:4;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,720px);padding:10px 18px calc(10px + var(--safe));background:#f6f8fbf2;border-top:1px solid var(--line);backdrop-filter:blur(10px)}.new{width:100%;min-height:58px;border:0;border-radius:15px;background:var(--blue);color:white;font-size:20px;font-weight:800}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.tab{min-height:43px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-size:16px;font-weight:700}.tab.active{background:var(--soft);color:var(--blue)}.editorbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}.status{color:var(--muted);font-size:14px}.editor input,.editor textarea{display:block;width:100%;border:0;outline:0;background:transparent;color:var(--ink);font:inherit}.editor input{padding:8px 0 14px;border-bottom:1px solid var(--line);font-size:25px;font-weight:800}.editor textarea{min-height:55vh;padding:16px 0;font-size:var(--size);line-height:1.7;resize:vertical}.editor input::placeholder,.editor textarea::placeholder{color:#9aa7b5}.group{margin:18px 0}.group h2{font-size:18px;margin:0 0 8px}.fontset{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.fontset button{min-height:54px;border:1px solid var(--line);border-radius:12px;background:white;font-weight:700}.fontset .chosen{border:2px solid var(--blue);background:var(--soft);color:var(--blue)}.setting{display:block;width:100%;min-height:62px;padding:10px 14px;margin:8px 0;border:1px solid var(--line);border-radius:13px;background:white;text-align:left;color:var(--ink);font-size:17px}.setting small{display:block;color:var(--muted);font-size:13px}.taskform{display:flex;gap:8px;margin-bottom:16px}.taskform input{flex:1;min-width:0;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:white;font:inherit;font-size:17px}.task{display:flex;align-items:center;gap:12px;margin-bottom:9px}.task input{width:24px;height:24px;accent-color:var(--blue)}.task span{flex:1;overflow-wrap:anywhere}.done span{text-decoration:line-through;color:var(--muted)}.notice{padding:12px;margin-bottom:15px;border:1px solid #d6e1ec;border-radius:12px;background:#edf4fb;color:#294563;font-size:15px}.toast{position:fixed;z-index:8;left:50%;bottom:140px;transform:translateX(-50%);padding:10px 16px;border-radius:99px;background:#26384a;color:white;font-size:15px;display:none}.toast.show{display:block}.hide{display:none!important}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #1e4f8a55;outline-offset:2px}
</style></head><body><div class="app"><header class="top"><div class="brand"><span class="mark">记</span>随记</div><button class="icon" id="gear" aria-label="设置">⚙</button></header><main id="main"></main></div><footer class="bottom" id="bottom"><button class="new" id="new">＋ 新建笔记</button><div class="tabs"><button class="tab active" data-view="notes">笔记</button><button class="tab" data-view="tasks">待办</button></div></footer><div class="toast" id="toast"></div><script>
(()=>{'use strict';const $=s=>document.querySelector(s),main=$('#main');let db,notes=[],tasks=[],view='notes',editing=null,dirty=false,timer=0;const now=()=>Date.now(),id=()=>crypto.randomUUID?crypto.randomUUID():now()+'-'+Math.random(),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),title=n=>(n.title||String(n.body||'').split('\n').find(x=>x.trim())||'无标题笔记').trim(),date=t=>new Date(t).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});function say(s){let x=$('#toast');x.textContent=s;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2000)}
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open('suiji-local',1);r.onupgradeneeded=()=>{let d=r.result;d.createObjectStore('notes',{keyPath:'id'});d.createObjectStore('tasks',{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function op(store,mode,fn){return new Promise((ok,no)=>{let r=fn(db.transaction(store,mode).objectStore(store));r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}const all=s=>op(s,'readonly',x=>x.getAll()),put=(s,v)=>op(s,'readwrite',x=>x.put(v)),del=(s,k)=>op(s,'readwrite',x=>x.delete(k));async function load(){[notes,tasks]=await Promise.all([all('notes'),all('tasks')]);notes.sort((a,b)=>(!!b.pin-!!a.pin)||b.updated-a.updated);tasks.sort((a,b)=>b.created-a.created)}
function page(v){view=v;$('#bottom').classList.toggle('hide',!['notes','tasks'].includes(v));document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
function card(n){return `<article class="card" data-open="${n.id}"><div class="row"><span class="muted">${n.pin?'📌 已置顶':''}</span><button class="small" data-pin="${n.id}">${n.pin?'取消置顶':'置顶'}</button></div><h3>${esc(title(n))}</h3><div class="preview">${esc(n.body||'暂无正文')}</div><div class="row" style="margin-top:10px"><span class="muted">${date(n.updated)}</span><button class="small danger" data-remove="${n.id}">删除</button></div></article>`}
function renderNotes(){let q=$('#q')?.value.trim().toLowerCase()||'',a=notes.filter(n=>!n.deleted&&(!q||(title(n)+' '+n.body).toLowerCase().includes(q))),p=a.filter(n=>n.pin),r=a.filter(n=>!n.pin),last=+(localStorage.getItem('suiji-backup')||0),dismiss=+(localStorage.getItem('suiji-dismiss')||0),remind=a.length>=3&&(!last||now()-last>30*864e5)&&now()-dismiss>7*864e5;return `<div class="heading"><h1>我的笔记</h1><p>重要的事情，随手记下来。</p></div><label class="search">⌕ <input id="q" type="search" placeholder="搜索笔记内容" value="${esc(q)}"></label>${remind?'<div class="notice">给笔记做一次备份，方便更换手机时恢复记录。 <button class="small" data-export>立即备份</button> <button class="small" data-dismiss>稍后提醒</button></div>':''}<div class="section">置顶笔记 <span class="muted">${p.length||''}</span></div>${p.length?`<div class="list">${p.map(card).join('')}</div>`:'<div class="empty"><b>暂无置顶笔记</b><p>把重要笔记置顶，方便快速查看。</p></div>'}<div class="section">最近笔记 <span class="muted">${a.length} 篇</span></div>${r.length?`<div class="list">${r.map(card).join('')}</div>`:(!p.length?'<div class="empty"><b>还没有笔记</b><p>点击下方「新建笔记」，开始记录。</p></div>':'')}</div>`}
function editor(){return `<div class="editor"><div class="editorbar"><button class="btn" data-back>← 返回</button><span class="status" id="status">${editing.saved?'已保存':'新笔记'}</span><button class="btn" data-back>完成</button></div><input id="title" maxlength="120" placeholder="标题（选填）" value="${esc(editing.title)}"><textarea id="body" placeholder="写下你想记录的内容……">${esc(editing.body)}</textarea></div>`}
function renderTasks(){let a=tasks.filter(t=>!t.done),d=tasks.filter(t=>t.done);return `<div class="heading"><h1>待办事项</h1><p>把要做的事情一项项完成。</p></div><form class="taskform" id="taskform"><input id="tasktext" maxlength="200" placeholder="添加一项待办"><button class="btn">添加</button></form><div class="section">待完成 <span class="muted">${a.length} 项</span></div>${a.length?a.map(taskHTML).join(''):'<div class="empty"><b>今天没有待办</b><p>可以在上方添加一项任务。</p></div>'}<div class="section">已完成</div>${d.length?d.map(taskHTML).join(''):'<p class="muted">完成的事项会显示在这里。</p>'}`}
function taskHTML(t){return `<div class="task ${t.done?'done':''}"><input type="checkbox" data-check="${t.id}" ${t.done?'checked':''}><span>${esc(t.text)}</span><button class="small danger" data-taskdel="${t.id}">删除</button></div>`}
function renderSettings(){let f=localStorage.getItem('suiji-font')||'20';return `<div class="heading"><button class="btn" data-back-notes>← 返回笔记</button><h1 style="margin-top:14px">设置</h1><p>按自己的习惯调整随记。</p></div><div class="group"><h2>字体大小</h2><div class="fontset">${[['18','标准'],['20','大字'],['24','特大']].map(([v,l])=>`<button data-font="${v}" class="${f===v?'chosen':''}">${l}<br>${v}px</button>`).join('')}</div></div><div class="group"><h2>数据备份</h2><button class="setting" data-export>导出备份<small>将笔记和待办保存为 JSON 文件</small></button><button class="setting" data-import>导入备份<small>合并备份，导入前自动备份当前数据</small></button><input id="file" type="file" accept=".json,application/json" class="hide"></div><div class="group"><h2>回收站</h2><button class="setting" data-trash>查看已删除笔记<small>可以恢复误删的笔记</small></button></div><p class="muted">笔记保存在当前设备。更换手机或清理浏览器数据前，请先导出备份。</p>`}
function renderTrash(){let a=notes.filter(n=>n.deleted);return `<div class="editorbar"><button class="btn" data-back-settings>← 返回</button><b>回收站</b></div>${a.length?a.map(n=>`<article class="card"><h3>${esc(title(n))}</h3><div class="preview">${esc(n.body)}</div><div class="row" style="margin-top:12px"><button class="small" data-restore="${n.id}">恢复</button><button class="small danger" data-purge="${n.id}">永久删除</button></div></article>`).join(''):'<div class="empty"><b>回收站是空的</b></div>'}`}
function render(){if(view==='notes')main.innerHTML=renderNotes();else if(view==='editor')main.innerHTML=editor();else if(view==='tasks')main.innerHTML=renderTasks();else if(view==='settings')main.innerHTML=renderSettings();else main.innerHTML=renderTrash();document.documentElement.style.setProperty('--size',(localStorage.getItem('suiji-font')||'20')+'px');if(view==='editor')setTimeout(()=>$('#body')?.focus(),80)}
async function save(){if(!editing||!dirty)return;clearTimeout(timer);let t=$('#title')?.value.trim()||'',b=$('#body')?.value||'';if(!t&&!b.trim()){dirty=false;return}editing={...editing,title:t,body:b,updated:now()};await put('notes',editing);dirty=false;let s=$('#status');if(s)s.textContent='已保存';await load()}
function schedule(){dirty=true;let s=$('#status');if(s)s.textContent='正在保存…';clearTimeout(timer);timer=setTimeout(save,500)}async function leaveEditor(){await save();page('notes')}
function backup(){return {app:'随记',schemaVersion:1,exportedAt:new Date().toISOString(),notes,todos:tasks}}function download(data,name){let u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function exportData(){await load();download(backup(),`随记备份_${new Date().toISOString().slice(0,10)}.json`);localStorage.setItem('suiji-backup',now());say('备份文件已导出');render()}
async function importData(file){if(!file)return;try{let x=JSON.parse(await file.text());if(!Array.isArray(x.notes)||!Array.isArray(x.todos))throw Error('备份格式不正确');if(!confirm(`备份中有 ${x.notes.length} 篇笔记、${x.todos.length} 项待办。导入前会先下载当前数据备份。是否继续？`))return;await load();download(backup(),`随记导入前备份_${new Date().toISOString().slice(0,10)}.json`);for(let n of x.notes){let old=notes.find(y=>y.id===n.id);if(n.id&&(!old||(n.updated||n.updatedAt||0)>=(old.updated||old.updatedAt||0)))await put('notes',{...n,pin:n.pin??n.pinned??false,updated:n.updated||n.updatedAt||now(),created:n.created||n.createdAt||now(),body:n.body||''})}for(let t of x.todos){let old=tasks.find(y=>y.id===t.id);if(t.id&&(!old||(t.updated||t.created||0)>=(old.updated||old.created||0)))await put('tasks',{...t,created:t.created||t.createdAt||now()})}await load();say('备份导入完成');page('notes')}catch(e){alert('导入失败：'+e.message)}finally{$('#file')&&($('#file').value='')}}
$('#new').onclick=()=>{editing={id:id(),title:'',body:'',pin:false,created:now(),updated:now(),saved:false};dirty=false;page('editor')};$('#gear').onclick=()=>page('settings');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>page(b.dataset.view));
main.addEventListener('input',e=>{if(e.target.id==='q'){let pos=e.target.selectionStart;render();$('#q')?.focus();$('#q')?.setSelectionRange(pos,pos)}if(e.target.id==='title'||e.target.id==='body')schedule()});
main.addEventListener('submit',async e=>{if(e.target.id==='taskform'){e.preventDefault();let text=$('#tasktext').value.trim();if(text){await put('tasks',{id:id(),text,done:false,created:now(),updated:now()});await load();render()}}});
main.addEventListener('change',async e=>{if(e.target.dataset.check){let t=tasks.find(x=>x.id===e.target.dataset.check);t.done=e.target.checked;t.updated=now();await put('tasks',t);await load();render()}if(e.target.id==='file')importData(e.target.files[0])});
main.addEventListener('click',async e=>{let article=e.target.closest('[data-open]');if(article&&!e.target.closest('button')){let n=notes.find(x=>x.id===article.dataset.open);if(n){editing={...n,saved:true};dirty=false;page('editor')}return}let b=e.target.closest('button');if(!b)return;let k=b.dataset;if(k.back)return leaveEditor();if(k.backNotes)return page('notes');if(k.backSettings)return page('settings');if(k.font){localStorage.setItem('suiji-font',k.font);render()}if(k.open){let n=notes.find(x=>x.id===k.open);editing={...n,saved:true};dirty=false;page('editor')}if(k.pin){let n=notes.find(x=>x.id===k.pin);n.pin=!n.pin;n.updated=now();await put('notes',n);await load();render()}if(k.remove){let n=notes.find(x=>x.id===k.remove);n.deleted=now();await put('notes',n);await load();render()}if(k.taskdel){await del('tasks',k.taskdel);await load();render()}if(k.restore){let n=notes.find(x=>x.id===k.restore);delete n.deleted;await put('notes',n);await load();render()}if(k.purge&&confirm('永久删除这篇笔记？')){await del('notes',k.purge);await load();render()}if(k.export)exportData();if(k.dismiss){localStorage.setItem('suiji-dismiss',now());render()}if(k.import)$('#file').click();if(k.trash){await load();page('trash')}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&dirty)save()});(async()=>{try{db=await openDB();await load();render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./service-worker.js').catch(console.warn)}catch(e){main.innerHTML='<div class="empty"><b>暂时无法打开随记</b><p>请使用最新版 Chrome 或 Safari，并检查浏览器存储权限。</p></div>';console.error(e)}})();})();
</script></body></html>
